h:100%;padding:17px 8px;border-radius:999px;text-decoration:none;color:#34231f!important;font-weight:800;font-size:clamp(13px,2.7vw,17px);letter-spacing:.015em;background:radial-gradient(ellipse at 36% 25%,#fffdf1 0%,#f9eed4 40%,#e6d3ac 77%,#a88d68 100%);border:3px solid #8f785c;box-shadow:inset 0 3px 3px #fffdf1,inset 0 -5px 7px #c6aa80,0 5px 0 #55443b,0 9px 13px #0009;transition:transform .12s,box-shadow .12s}.chapter a:active{transform:translateY(4px);box-shadow:inset 0 2px 5px #c6aa80,0 1px 0 #55443b,0 3px 6px #0008}.chapter h2{display:none}#reveal h1{letter-spacing:.15em}.center.gold{box-shadow:0 0 0 3px #cba456,0 0 24px 10px rgba(248,194,65,.45),0 0 48px 20px rgba(248,194,65,.2),inset 0 0 18px #d9ad50;transition:box-shadow 1s;animation:sunrise 1.25s ease-out both}@keyframes sunrise{0%{box-shadow:0 0 0 3px #8e7762,inset 0 0 8px #000}45%{box-shadow:0 0 0 3px #ffe59d,0 0 38px 18px #ffdc69,0 0 75px 35px rgba(255,203,61,.75),inset 0 0 25px #ffe28b}100%{box-shadow:0 0 0 3px #cba456,0 0 24px 10px rgba(248,194,65,.45),0 0 48px 20px rgba(248,194,65,.2),inset 0 0 18px #d9ad50}}.center.gold .finger{animation:goldgray 2.8s ease-in-out infinite alternate;filter:drop-shadow(0 0 4px #d9ae4b)}@keyframes goldgray{from{stroke:#999;opacity:.7;filter:none}to{stroke:#f8c859;opacity:1;filter:drop-shadow(0 0 5px #f2bb51)}}.center.gray .finger{stroke:#a7a7a7}.center.scanning .finger{animation:none!important;stroke:#aeeedc!important}.center.scanning .scanfx{display:block}.scanfx::after{content:"";position:absolute;inset:13%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,transparent 260deg,rgba(88,255,217,.08) 290deg,rgba(102,255,226,.45) 355deg,transparent 360deg);animation:radar 1.3s linear infinite}@keyframes radar{to{transform:rotate(360deg)}}.progress{height:7px}.status{min-height:24px}

 .remaining-label{position:absolute;bottom:3%;left:0;width:100%;z-index:9;pointer-events:none;font:600 clamp(5px,.8vw,9px)/1.1 Arial,sans-serif;letter-spacing:0;color:#e9e4df;text-align:center;text-shadow:0 1px 1px #000;white-space:nowrap}</style></head><body><main id="welcome"><p class="instruction">Composer le code à 4 chiffres</p><div class="stage" id="stage"><img class="base" src="sukobaat_fond.png"><div class="ring" id="ring" style="background-image:url('sukobaat_couronne.png')"></div><div class="stop" style="background-image:url('sukobaat_butee.png')"></div><div class="center" id="center"><div class="flip" id="flip"><div class="half top"><span class="glyph" id="upper">4</span></div><div class="half bottom"><span class="glyph" id="lower">4</span></div><div class="half top flap-top" id="topflap"><span class="glyph" id="oldDigit">4</span></div><div class="half bottom flap-bottom" id="bottomflap"><span class="glyph" id="newDigit">4</span></div><div class="hinge"></div><span class="remaining-label" id="remainingLabel">chiffres restants</span></div><svg class="finger" fill="none" id="finger" stroke-linecap="round" stroke-width="2" viewbox="0 0 100 100"><path d="M16 51C16 29 30 13 50 13S84 29 84 51M21 62C18 38 29 20 50 20S82 38 79 62M28 66C24 45 31 28 50 28S76 45 72 67M35 70C30 51 35 35 50 35S68 51 65 71M42 75C38 60 40 43 50 43S60 60 57 78M50 51C50 68 48 83 44 91M21 70C25 81 30 87 37 92M30 75C33 83 36 88 41 94M63 81C61 86 59 91 56 95M72 75C70 85 67 90 63 95M80 69C77 82 73 89 69 94"></path></svg><div class="scanfx"><div class="scangrid"></div><div class="scanbeam"></div><div class="scanpulse"></div></div></div></div><p class="clue">Indice : Code de la boîte à clés</p><div class="progress"><div id="progress"></div></div><div class="status" id="status"></div><button class="reset" id="reset">↻ Recommencer</button></main><main id="reveal" hidden aria-label="Genèse et mode d’emploi"><div class="hero" id="hero"><img src="sukobaat_fond.png" alt="Téléphone SUKOBAAT"><img class="hero-ring" src="sukobaat_couronne.png" alt=""><img class="hero-stop" src="sukobaat_butee.png" alt=""><div class="hero-finger" id="heroFinger" aria-label="Empreinte digitale"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M16 51C16 29 30 13 50 13S84 29 84 51M21 62C18 38 29 20 50 20S82 38 79 62M28 66C24 45 31 28 50 28S76 45 72 67M35 70C30 51 35 35 50 35S68 51 65 71M42 75C38 60 40 43 50 43S60 60 57 78M50 51C50 68 48 83 44 91M21 70C25 81 30 87 37 92M30 75C33 83 36 88 41 94M63 81C61 86 59 91 56 95M72 75C70 85 67 90 63 95M80 69C77 82 73 89 69 94"/></svg></div></div><section class="chapter"><a id="geneseLink" href="#genese-page">Découvrir la Genèse</a></section><section class="chapter"><a id="modeLink" href="#mode-page">Mode d’emploi</a></section></main><section id="contentPage" hidden><div class="content-card"><button type="button" id="backToMenu" class="backToMenu">← Retour au menu</button><article id="storyContent" hidden><h1>Genèse</h1><div id="storyBody"></div></article><article id="manualContent" hidden><h1>Mode d’emploi</h1><div class="demo-tabs"><button type="button" class="demo-tab active" data-mode="0">Sans USB-C</button><button type="button" class="demo-tab" data-mode="1">Avec USB-C</button></div><div class="manual-step"><span id="stepNumber">1 / 5</span><img id="manualImage" alt="Illustration originale du mode d’emploi SUKOBAAT" loading="eager"><p id="stepText"></p></div><div class="step-actions"><button type="button" id="prevStep">← Précédent</button><button type="button" id="nextStep">Étape suivante →</button></div></article></div></section><script>
const stage=document.getElementById('stage'),ring=document.getElementById('ring'),center=document.getElementById('center'),flip=document.getElementById('flip'),finger=document.getElementById('finger'),status=document.getElementById('status'),progress=document.getElementById('progress');let seq=[],busy=false,hold=0,frame=0,complete=false,audio;
const coords={4:[553,478],3:[628,456],2:[703,478],1:[756,530],0:[686,734],9:[614,744],8:[543,725],7:[493,665],6:[480,597],5:[499,536]};
let audioEnabled=false;
function soundInit(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();audioEnabled=true}catch(e){status.textContent='Audio indisponible sur ce navigateur.'}}
function tone(freq,duration,vol=.04,type='sine',delay=0){if(!audioEnabled)return;const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+duration+.02)}
function noise(duration,vol=.055,delay=0){if(!audioEnabled)return;const t=audio.currentTime+delay,n=audio.createBuffer(1,Math.ceil(audio.sampleRate*duration),audio.sampleRate),a=n.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const src=audio.createBufferSource(),g=audio.createGain(),filter=audio.createBiquadFilter();filter.type='bandpass';filter.frequency.value=1250;src.buffer=n;g.gain.value=vol;src.connect(filter).connect(g).connect(audio.destination);src.start(t)}
function clicks(n){for(let i=0;i<Math.max(6,n+3);i++){noise(.037,.075,i*.115);tone(115+(i%3)*26,.046,.025,'triangle',i*.115)}}
function dialSound(){noise(.18,.025);tone(170,.22,.025,'sawtooth')}
function successSound(){[540,680,840,1080].forEach((f,i)=>tone(f,.5,.045,'sine',i*.13))}
function radarSound(){if(!audioEnabled)return;const now=audio.currentTime;const o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type='sine';o.frequency.setValueAtTime(390,now);o.frequency.exponentialRampToValueAtTime(1120,now+.27);o.frequency.exponentialRampToValueAtTime(460,now+.62);f.type='lowpass';f.frequency.value=1600;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.055,now+.07);g.gain.exponentialRampToValueAtTime(.0001,now+.72);o.connect(f).connect(g).connect(audio.destination);o.start(now);o.stop(now+.74);tone(785,.42,.013,'sine',.18)}
const phoneRingtone=new Audio('sonnerie_continue.mp3');phoneRingtone.preload='auto';phoneRingtone.volume=.85;
let ringing=false,transitionTimer=0;
function stopRinging(){ringing=false;clearTimeout(transitionTimer);phoneRingtone.pause();phoneRingtone.currentTime=0;const hero=document.getElementById('hero');hero.classList.remove('moving');hero.classList.add('still')}
function ringTransition(){ringing=true;const hero=document.getElementById('hero'),reveal=document.getElementById('reveal');reveal.classList.remove('ready');hero.classList.remove('still');hero.classList.add('moving');hero.style.display='';phoneRingtone.currentTime=0;phoneRingtone.play().catch(()=>{});transitionTimer=setTimeout(()=>{if(!ringing)return;hero.classList.remove('moving');hero.classList.add('still');reveal.classList.add('ready')},2300)}
// Sur le menu final, un clic sur le téléphone rejoue uniquement la vibration et la sonnerie.
let replayTimer=0;
const replayHero=document.getElementById('hero');
replayHero.setAttribute('role','button');
replayHero.setAttribute('tabindex','0');
replayHero.setAttribute('aria-label','Faire sonner et vibrer le téléphone');
function replayPhone(){
  if(document.getElementById('reveal').hidden || !document.getElementById('contentPage').hidden)return;
  if(!document.getElementById('reveal').classList.contains('ready'))return;
  clearTimeout(replayTimer);
  phoneRingtone.pause();
  phoneRingtone.currentTime=0;
  replayHero.classList.remove('still');
  replayHero.classList.add('replay-shake');
  phoneRingtone.play().catch(()=>{});
  replayTimer=setTimeout(()=>{replayHero.classList.remove('replay-shake');replayHero.classList.add('still')},2300);
}
replayHero.addEventListener('click',replayPhone);
replayHero.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();replayPhone()}});
function changeCount(n){document.getElementById('remainingLabel').textContent=n===1?'chiffre restant':'chiffres restants';const u=document.getElementById('upper'),l=document.getElementById('lower'),f=document.getElementById('oldDigit'),b=document.getElementById('newDigit'),t=document.getElementById('topflap'),bt=document.getElementById('bottomflap');const old=u.textContent;f.textContent=old;b.textContent=String(n);l.textContent=String(n);t.classList.remove('go');bt.classList.remove('go');void t.offsetWidth;t.classList.add('go');bt.classList.add('go');setTimeout(()=>{u.textContent=String(n);t.classList.remove('go');bt.classList.remove('go');f.textContent=String(n)},590)}

// Each digit is a single uninterrupted recording (0.85 s outward + 1.5 s return).
const dialSamples={};
for(let i=0;i<=9;i++){const a=new Audio(`cadran_${i}_complet.mp3`);a.preload='auto';a.volume=1;dialSamples[i]=a;}
function playDial(n){const a=dialSamples[n];a.pause();a.currentTime=0;a.play().catch(()=>{});}
function dial(n){if(busy||seq.length===4)return;busy=true;soundInit();playDial(n);const [x,y]=coords[n];const a=Math.atan2(y-603,x-628)*180/Math.PI;const travel=((45-a)%360+360)%360;ring.style.transition='transform 850ms ease-in-out';ring.style.transform=`rotate(${travel}deg)`;setTimeout(()=>{ring.style.transition='transform 1500ms cubic-bezier(.12,.58,.18,1)';ring.style.transform='rotate(0deg)';setTimeout(()=>{seq.push(n);busy=false;if(seq.length<4)changeCount(4-seq.length);else{flip.style.display='none';center.classList.add(seq.join('')==='2444'?'gold':'gray');if(seq.join('')==='2444'){successSound();setTimeout(()=>{finger.style.display='block'},650)}else finger.style.display='block';status.textContent='Maintenez votre doigt — analyse de 5 secondes.'}},1530)},870)}
Object.entries(coords).forEach(([n,[x,y]])=>{const hit=document.createElement('button');hit.type='button';hit.className='hot';hit.style.left=(x/1254*100)+'%';hit.style.top=(y/1254*100)+'%';hit.setAttribute('aria-label','Composer '+n);stage.append(hit);hit.addEventListener('click',()=>dial(Number(n)))});
let lastBeep=-1;
function scan(){if(!hold)return;let v=Math.min(1,(performance.now()-hold)/5000);progress.style.width=(v*100)+'%';let step=Math.floor(v*5);if(step!==lastBeep){lastBeep=step;radarSound()}status.textContent=v<.2?'Analyse en cours · Acquisition du relief…':v<.45?'Analyse en cours · Cartographie des lignes…':v<.7?'Analyse en cours · Détection des minuties…':v<.92?'Analyse en cours · Vérification des points…':'Analyse en cours · Finalisation…';if(v>=1){hold=0;complete=true;center.classList.remove('scanning');status.textContent='Analyse terminée';document.getElementById('welcome').hidden=true;document.getElementById('reveal').hidden=false;const good=seq.join('')==='2444';document.getElementById('geneseLink').textContent='Genèse';document.getElementById('heroFinger').classList.toggle('grayprint',!good);window.scrollTo(0,0);ringTransition();return}frame=requestAnimationFrame(scan)}
center.addEventListener('pointerdown',e=>{if(seq.length!==4||complete)return;e.preventDefault();center.setPointerCapture(e.pointerId);soundInit();hold=performance.now();lastBeep=-1;center.classList.add('scanning');scan()});function release(){if(!hold)return;hold=0;cancelAnimationFrame(frame);center.classList.remove('scanning');progress.style.width='0%';status.textContent='Maintenez votre doigt — analyse de 5 secondes.'}center.addEventListener('pointerup',release);center.addEventListener('pointercancel',release);center.addEventListener('lostpointercapture',release);
document.getElementById('reset').onclick=()=>{stopRinging();seq=[];busy=false;complete=false;release();ring.style.transition='none';ring.style.transform='rotate(0deg)';center.className='center';flip.style.display='';finger.style.display='none';for(let id of ['upper','lower','oldDigit','newDigit'])document.getElementById(id).textContent='4';document.getElementById('remainingLabel').textContent='chiffres restants';status.textContent='';progress.style.width='0%';document.getElementById('welcome').hidden=false;document.getElementById('reveal').hidden=true;document.getElementById('reveal').classList.remove('ready');document.getElementById('hero').style.display=''};

const fullStory=["Alors, pourquoi j'ai fabriqué cet objet pour toi ?", "Au départ, franchement, rien de tout ça n'était prévu.", "Juste une pub pour un gadget. Mon téléphone sait très bien que j'en suis friand, alors évidemment il m'en propose à longueur de journée.", "Et là… Un combiné rose ? Comment passer à côté !", "Je t'ai imaginée tout de suite avec, chez toi, un jour de télétravail, au téléphone.", "Ça aurait pu s'arrêter là. Acheter le gadget, te l'offrir, rigoler cinq minutes et voilà.", "Sauf que… va savoir pourquoi, l'idée est restée. Et puis une autre est venue derrière. Puis une autre.", "Je me suis mis à penser à ton boulot, et surtout à ce que tu aimes dedans : les gens, les rencontres, les échanges.", "Ce métier, tu en as eu le goût en regardant ton père le faire.", "Et à son époque, forcément, on le faisait autrement. Pas de portable. Pourtant, le téléphone était déjà indispensable.", "Il avait simplement une place : le bureau.", "On appelait, on décrochait, on prenait un rendez-vous, on discutait… puis on raccrochait et on allait voir les gens.", "Le téléphone faisait partie du boulot, mais il ne prenait pas toute la place.", "Et quelque part, j'avais envie que tu retrouves un peu de cette façon de travailler les jours où tu es chez toi.", "C'est là que mon petit combiné rose a commencé à devenir autre chose.", "Je me suis dit qu'on devait pouvoir garder tout ce que ton iPhone sait faire aujourd'hui, mais retrouver cette façon-là de téléphoner.", "Un vrai téléphone de bureau. Mais avec ton iPhone.", "L'idée était là.", "Avec quand même un léger problème : je n'avais absolument aucune idée de comment fabriquer cet objet.", "Mais les Rieu sont têtus. Et un peu cul-Rieu aussi.", "Alors j'ai commencé à chercher.", "Mon père, lui, aurait probablement passé des heures dans des bibliothèques, à fouiller dans des bouquins pour comprendre comment réaliser un objet pareil.", "Je n'ai clairement pas sa patience.", "Moi, j’ai la chance de pouvoir me faire aider par l’IA.", "Alors j'ai posé des questions. Beaucoup de questions. J'ai essayé de comprendre, imaginé des solutions, changé d'avis, recommencé…", "Et puis il n'y avait pas que la question de savoir comment le faire fonctionner.", "Il fallait penser l'objet dans son ensemble.", "À quoi il allait ressembler. Où poser l'iPhone pour qu'il fasse naturellement partie de l'ensemble. Comment retrouver le charme d'un vrai téléphone de bureau. Comment adapter ce fameux combiné rose par lequel toute l'histoire avait commencé.", "J'ai fini par dénicher un vieux téléphone à cadran qui avait exactement ce que je cherchais : une vraie gueule de téléphone.", "Et après, il a fallu faire rentrer le présent dans le passé.", "Adapter le combiné, cacher l'électronique, trouver comment faire cohabiter tout ça et faire disparaître autant que possible toute la technique derrière l'objet.", "Bref, penser chaque détail pour qu'à la fin, on ne voie plus vraiment tout ce qu'il y a derrière.", "Et petit à petit, entre les idées, les recherches, les essais et quelques prises de tête, la pub pour un combiné rose est devenue l'objet que tu as maintenant devant toi.", "Ton iPhone y trouve naturellement sa place, avec tout ce qu'il sait faire.", "Et quand tu en as envie, SUKOBAAT lui redonne simplement ce qu'il a perdu avec le temps : une place sur le bureau, une vraie sonnerie et un combiné à décrocher.", "Juste une autre façon de téléphoner.", "Et j'espère surtout un petit plaisir en plus les jours où tu travailles de chez toi.", "Je l'ai appelé SUKOBAAT.", "Sukoon, pour le calme, la tranquillité, le fait de pouvoir poser ton téléphone, le laisser à sa place et continuer ta journée sans avoir à le garder avec toi.", "Baat, pour la parole, la conversation, l'échange. Parce qu'au bout du compte, un téléphone sert quand même surtout à ça : parler à quelqu'un.", "Et pourquoi je suis allé chercher ces deux mots du côté de l'Inde… ça, je pense que je n'ai pas besoin de te l'expliquer.", "Je l'ai imaginé, conçu et bricolé pour toi.", "Maintenant, j'espère surtout que tu vas le kiffer et t'en servir.", "Et puis il fallait quand même que je laisse quelque part une petite phrase rien qu'à nous :", "Il y a des fils qui ne se coupent pas."];
const simpleStory=["SUKOBAAT est né d’une idée simple : retrouver le plaisir d’un vrai téléphone de bureau sans renoncer à ce qu’un smartphone sait faire aujourd’hui.", "Le point de départ était un combiné rose au charme rétro. Puis l’idée a grandi : lui redonner une vraie place, une sonnerie et un geste familier — décrocher, parler, raccrocher.", "Le smartphone reste au cœur du système. Posé sur SUKOBAAT, il conserve tout ce qu’il sait faire. L’objet lui ajoute simplement une présence physique sur le bureau et une autre façon de vivre les appels.", "Il a fallu faire cohabiter un ancien téléphone à cadran, un combiné adapté et une électronique discrète, avec une règle : laisser la technique disparaître autant que possible derrière l’objet.", "Le nom SUKOBAAT vient de deux mots : Sukoon, pour le calme et la tranquillité ; Baat, pour la parole, la conversation et l’échange.", "SUKOBAAT, c’est donc une autre façon de téléphoner : garder le présent, retrouver un peu du geste d’avant."];
